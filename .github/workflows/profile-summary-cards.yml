name: GitHub-Profile-Summary-Cards

on:
  schedule: # 每 24 小時執行一次
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # 建議在 repo Settings → Secrets 新增 SUMMARY_GITHUB_TOKEN (PAT)，
          # 沒有的話會退回使用內建 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 8
          EXCLUDE: ""
          AUTO_PUSH: true
          THEME: "default"
